<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - VIVIDLENS GALLERY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="pengaturan.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- SCREEN 1: LOGIN ADMIN -->
    <div id="loginScreen" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 w-full max-w-md">
            <h2 class="text-xl font-bold mb-4 text-center">Login Admin</h2>
            <input type="password" id="adminPassword" placeholder="Masukkan Password Admin" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl mb-4 outline-none focus:ring-2 focus:ring-slate-900">
            <button onclick="loginAdmin()" class="w-full py-3 bg-slate-900 text-white font-bold rounded-xl hover:bg-black transition">Masuk</button>
        </div>
    </div>

    <!-- SCREEN 2: GENERATOR -->
    <main id="adminPanel" class="hidden max-w-2xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="bg-white rounded-2xl p-8 shadow-sm border border-slate-100 relative">
            <h2 class="text-xl font-bold mb-6 text-slate-800">Buat Gallery Baru</h2>
            
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Nama Client</label>
                        <input type="text" id="admNama" placeholder="Amalia" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Universitas</label>
                        <input type="text" id="admUniv" placeholder="UMY" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Tanggal</label>
                        <input type="date" id="admTanggal" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Jumlah Pilihan (Kuota)</label>
                        <input type="number" id="admLimit" value="0" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Link Google Drive</label>
                    <input type="text" id="admDrive" placeholder="https://drive.google.com/..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                </div>
                <button onclick="saveToDatabase()" class="w-full py-4 bg-slate-900 text-white font-bold rounded-xl hover:bg-black transition">Generate Link</button>
            </div>

            <!-- HASIL GENERATE -->
            <div id="resultBox" class="hidden mt-6 p-4 bg-green-50 rounded-xl border border-green-200">
                <p class="text-xs font-bold text-green-700 uppercase mb-2">Link Premium Berhasil Dibuat:</p>
                <input type="text" id="generatedUrl" readonly class="w-full p-2 bg-white border border-slate-200 text-sm text-slate-600 rounded-lg outline-none mb-2">
                <button onclick="navigator.clipboard.writeText(document.getElementById('generatedUrl').value); alert('Salin berhasil!');" class="px-4 py-2 bg-slate-800 text-white text-xs rounded-lg">Salin Link</button>
            </div>
        </div>
    </main>

    <script>
        let supabaseClient;
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof CONFIG_APP !== 'undefined') {
                supabaseClient = supabase.createClient(CONFIG_APP.supabaseUrl, CONFIG_APP.supabaseKey);
            }
        });

        function loginAdmin() {
            // Silakan ganti password admin kamu di bawah ini (bawaan: admin123)
            if(document.getElementById('adminPassword').value === 'admin123') {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
            } else {
                alert('Password salah!');
            }
        }

        async function saveToDatabase() {
            const nama = document.getElementById('admNama').value.trim();
            const univ = document.getElementById('admUniv').value.trim();
            const tanggal = document.getElementById('admTanggal').value;
            const limit = parseInt(document.getElementById('admLimit').value) || 0;
            const driveLink = document.getElementById('admDrive').value.trim();

            if(!nama || !univ || !tanggal || !driveLink) return alert('Semua data wajib diisi!');

            // Membuat format slug cantik otomatis: amalia-umy
            const slug = `${nama.toLowerCase().replace(/[^a-z0-9]/g, '')}-${univ.toLowerCase().replace(/[^a-z0-9]/g, '')}`;

            const { error } = await supabaseClient.from('clients').insert([{ 
                slug: slug, 
                nama: nama, 
                univ: univ, 
                tanggal: tanggal, 
                limit_foto: limit, 
                drive_link: driveLink 
            }]);

            if (error) {
                alert('Gagal! Kemungkinan link / slug ini sudah pernah dibuat sebelumnya.');
            } else {
                const finalUrl = `${window.location.origin}/${slug}`;
                document.getElementById('generatedUrl').value = finalUrl;
                document.getElementById('resultBox').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
